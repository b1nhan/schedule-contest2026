<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch thi 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* scales — spacing: 4 8 12 16 24 32 48 · type: 12 14 16 20 24 36 */
  :root {
    --bg:#f8fafc; --surface:#fff; --sunken:#f1f5f9;
    --text:#0f172a; --text-2:#475569; --text-3:#64748b; --line:#e2e8f0;
    --primary:#0f172a; --on-primary:#fff;
    --red:#b91c1c; --red-bg:#fef2f2; --amber:#b45309; --amber-bg:#fffbeb; --amber-line:#fde68a;
    --green:#15803d; --green-bg:#f0fdf4;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
    --shadow-xl:0 20px 25px -5px rgba(15,23,42,.15), 0 8px 10px -6px rgba(15,23,42,.1);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1120; --surface:#111827; --sunken:#1e293b;
      --text:#f1f5f9; --text-2:#cbd5e1; --text-3:#94a3b8; --line:#1e293b;
      --primary:#f1f5f9; --on-primary:#0f172a;
      --red:#fca5a5; --red-bg:#3b1414; --amber:#fcd34d; --amber-bg:#2a1f0a; --amber-line:#4a3510;
      --green:#86efac; --green-bg:#0f2a1a;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 'Be Vietnam Pro',system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  main { max-width:max(1120px, 90vw); margin:0 auto; padding:32px 16px 64px; }
  button, input, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid #6366f1; outline-offset:2px; }

  header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:32px; }
  h1 { margin:0; font-size:24px; line-height:1.25; font-weight:700; letter-spacing:-.01em; }
  .sub { color:var(--text-3); margin-top:4px; }
  section { margin-top:48px; }
  .sec-head { display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  h2 { margin:0; font-size:16px; font-weight:600; }
  .count { font-size:12px; font-weight:600; padding:0 8px; border-radius:99px; background:var(--sunken); color:var(--text-2); }
  .eyebrow { font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3); }
  .muted { color:var(--text-3); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }

  .btn { display:inline-flex; align-items:center; gap:4px; height:36px; padding:0 16px; border-radius:8px; border:1px solid transparent; background:none; cursor:pointer; font-weight:500; color:var(--text-2); }
  .btn:hover { background:var(--sunken); color:var(--text); }
  .btn.primary { background:var(--primary); color:var(--on-primary); box-shadow:var(--shadow-sm); }
  .btn.primary:hover { opacity:.9; }
  .btn.danger { color:var(--red); }
  .btn.danger:hover { background:var(--red-bg); }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
  [data-open] { cursor:pointer; transition:border-color .15s; }
  .card[data-open]:hover { border-color:var(--text-3); }

  /* hero */
  .status { font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; text-decoration:none; margin-left:8px; white-space:nowrap; }
  .status.ok { background:var(--green-bg); color:var(--green); }
  .status.bad { background:var(--red-bg); color:var(--red); }
  .dash { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
  .dash > .card { padding:24px; }
  .dash .col-body { max-height:520px; overflow:auto; margin:16px -8px 0; padding:0 8px; }
  .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
  .todo + .todo { margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .todo-head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .todo ul { list-style:none; padding:0; margin:8px 0 0; display:grid; gap:8px; }
  .todo label { display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
  .todo input { margin:3px 0 0; accent-color:var(--green); width:16px; height:16px; flex:none; }
  .dash .info { padding:0; border:none; box-shadow:none; gap:12px; }
  @media (max-width:1000px) { .dash { grid-template-columns:1fr 1fr; } .dash > :last-child { grid-column:1 / -1; } }
  @media (max-width:700px) { .dash, .split { grid-template-columns:1fr; } }
  .next-main { display:flex; gap:24px; align-items:flex-start; }
  .next-num { text-align:center; min-width:64px; }
  .next-num b { display:block; font-size:48px; line-height:1; font-weight:700; letter-spacing:-.02em; }
  .next-num span { color:var(--text-3); font-size:14px; }
  .next h3 { margin:4px 0 8px; font-size:20px; line-height:1.25; font-weight:600; }
  .place { font-size:16px; font-weight:600; margin-top:8px; }
  .after { border-top:1px solid var(--line); margin-top:24px; padding-top:16px; }
  .mini { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:8px; }
  .mini li { display:flex; gap:8px; align-items:baseline; }
  .mini li .dot { transform:translateY(-1px); }
  .mini-date { font-weight:600; font-size:12px; min-width:40px; }
  .phases { padding:24px; display:grid; gap:24px; }
  .phase + .phase { margin-top:12px; }
  .phase-top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .phase .progress i { background:var(--c); }


  .progress { height:4px; border-radius:99px; background:var(--sunken); overflow:hidden; margin-top:8px; }
  .progress i { display:block; height:100%; background:var(--green); border-radius:99px; }

  /* conflicts */
  .conflicts { overflow:hidden; }
  .cf { display:flex; gap:16px; padding:16px 24px; border-top:1px solid var(--line); }
  .cf:first-child { border-top:none; }
  .cf-date { width:56px; flex:none; align-self:flex-start; text-align:center; padding:4px 0; border-radius:8px; background:var(--amber-bg); color:var(--amber); line-height:1.2; }
  .cf-date b { display:block; font-size:20px; }
  .cf-date span { font-size:12px; }
  .cf.hard .cf-date { background:var(--red-bg); color:var(--red); }
  .cf-type { font-size:12px; font-weight:600; color:var(--amber); margin-bottom:4px; }
  .cf.hard .cf-type { color:var(--red); }
  .cf-ev { display:flex; gap:8px; align-items:baseline; }
  .cf-ev .dot { transform:translateY(-1px); }
  details summary { cursor:pointer; padding:12px 24px; color:var(--text-3); border-top:1px solid var(--line); list-style-position:inside; }
  details summary:hover { color:var(--text); }
  details .cf { opacity:.75; }
  .empty { padding:24px; color:var(--text-3); }

  /* period overlaps: per-pair mini timeline, hatched band = shared days */
  .ov { padding:16px 24px; border-top:1px solid var(--line); }
  .ov:first-child { border-top:none; }
  .ov-head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:8px; }
  .ov-kind { font-size:12px; font-weight:600; padding:0 8px; border-radius:99px; background:var(--amber-bg); color:var(--amber); }
  .lane { display:grid; grid-template-columns:minmax(0,300px) 1fr; gap:16px; align-items:center; padding:4px 0; }
  .lane-label { display:flex; gap:8px; align-items:center; min-width:0; }
  .lane-label > span:last-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lane-track { position:relative; height:20px; border-radius:6px; background:var(--sunken); }
  .lane-bar { position:absolute; top:4px; bottom:4px; border-radius:4px; }
  .lane-bar.single { width:12px !important; top:4px; bottom:auto; height:12px; transform:translateX(-6px) rotate(45deg); border-radius:2px; }
  .band { position:absolute; top:-4px; bottom:-4px; pointer-events:none; border-inline:2px solid #d97706;
          background:repeating-linear-gradient(45deg, rgba(217,119,6,.45) 0 3px, transparent 3px 7px); }
  .lane-dates { display:flex; justify-content:space-between; font-size:12px; color:var(--text-3); margin-top:4px; }
  .legend { display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--text-3); margin-left:auto; }
  .legend i { display:inline-block; width:16px; height:12px; border-inline:2px solid #d97706; background:repeating-linear-gradient(45deg, rgba(217,119,6,.45) 0 3px, transparent 3px 7px); }
  .info-grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr)); align-items:start; }
  .info { padding:24px; display:flex; flex-direction:column; gap:12px; }
  .info h3 { margin:0; font-size:16px; line-height:1.4; font-weight:600; }
  .links { display:flex; flex-wrap:wrap; gap:8px; }
  .links a { font-size:12px; font-weight:500; padding:4px 12px; border-radius:99px; background:var(--sunken); color:var(--text); text-decoration:none; }
  .links a:hover { background:var(--line); }
  .info a.mail { color:inherit; }
  .facts { margin:0; padding-left:20px; color:var(--text-2); display:grid; gap:4px; }
  .ask { background:var(--amber-bg); border-radius:8px; padding:12px 16px; }
  .ask .eyebrow { color:var(--amber); }
  .ask ul { margin:8px 0 0; padding-left:20px; display:grid; gap:4px; }
  @media (max-width:640px) { .lane { grid-template-columns:1fr; gap:4px; } .ov { padding:16px; } }
  .empty.ok { color:var(--green); font-weight:500; }
  .clash-ev { display:grid; gap:2px; }
  .clash-ev + .clash-ev { margin-top:8px; }
  .days { padding:16px 24px 24px; border-top:1px solid var(--line); }
  .days-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .day-chip { display:inline-flex; align-items:center; gap:8px; padding:4px 12px 4px 4px; border-radius:99px; background:var(--sunken); cursor:pointer; }
  .day-chip b { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--surface); }
  .day-chip.clash b { background:var(--red); color:#fff; }

  /* timeline */
  .tl { overflow-x:auto; padding:16px 24px 24px; }
  .tl-inner { min-width:760px; position:relative; --lw:120px; padding-top:24px; }
  .months { display:flex; margin-left:var(--lw); height:32px; align-items:center; }
  .months div { font-size:12px; font-weight:600; color:var(--text-3); padding-left:8px; }
  .grid-lines { position:absolute; top:24px; bottom:0; left:var(--lw); right:0; pointer-events:none; }
  .grid-lines i { position:absolute; top:0; bottom:0; width:1px; background:var(--line); }
  .row { display:flex; border-top:1px solid var(--line); }
  .row-label { width:var(--lw); flex:none; font-size:12px; font-weight:600; padding:12px 8px 0 0; display:flex; gap:8px; align-items:baseline; }
  .track { position:relative; flex:1; }
  .bar { position:absolute; height:24px; border-radius:6px; color:#fff; font-size:12px; font-weight:500; line-height:24px; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:8px; }
  .bar:hover { filter:brightness(1.1); }
  .bar.single { width:14px !important; height:14px; padding:0; margin-top:5px; transform:translateX(-7px) rotate(45deg); border-radius:3px; box-shadow:0 0 0 2px var(--surface); }
  .bar.tentative { opacity:.6; background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.3) 6px 12px); }
  .bar.past { opacity:.35; }
  .today { position:absolute; top:20px; bottom:0; width:2px; margin-left:-1px; background:var(--red); z-index:2; pointer-events:none; }
  .today span { position:absolute; top:-20px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:12px; font-weight:600; color:#fff; background:var(--red); padding:0 8px; border-radius:99px; line-height:20px; }
  @media (prefers-color-scheme: dark) { .today span { color:#0f172a; } }

  /* list */
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:500; color:var(--text-3); }
  .chip[aria-pressed="true"] { color:var(--text); border-color:var(--text-3); }
  .chip[aria-pressed="false"] .dot { background:var(--line) !important; }
  .toggle { display:flex; gap:8px; align-items:center; color:var(--text-2); cursor:pointer; }
  .month + .month { margin-top:32px; }
  .month-head { margin-bottom:12px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); align-items:start; }
  .ev { padding:20px 24px; display:flex; flex-direction:column; gap:8px; }
  .ev.past { opacity:.55; }
  .ev-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ev-contest { display:flex; gap:8px; align-items:center; }
  .ev h3 { margin:0; font-size:16px; line-height:1.4; font-weight:600; }
  .meta { color:var(--text-2); display:flex; flex-wrap:wrap; column-gap:12px; }
  .notes { color:var(--text-3); font-size:14px; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--sunken); color:var(--text-2); white-space:nowrap; }
  .badge.soon { background:var(--red-bg); color:var(--red); }
  .badge.now { background:var(--green-bg); color:var(--green); }
  .tag { font-size:12px; font-weight:600; color:var(--amber); }
  .checklist { border-top:1px solid var(--line); padding-top:12px; margin-top:4px; }
  .checklist-head { display:flex; justify-content:space-between; font-size:12px; color:var(--text-3); }
  .checklist ul { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px; }
  .checklist label { display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
  .checklist input { margin:3px 0 0; accent-color:var(--green); width:16px; height:16px; flex:none; }
  .checklist li.done { color:var(--text-3); text-decoration:line-through; }

  /* dialog */
  dialog { border:none; border-radius:16px; padding:0; width:min(560px,100% - 32px); background:var(--surface); color:var(--text); box-shadow:var(--shadow-xl); }
  dialog::backdrop { background:rgba(15,23,42,.4); }
  dialog form { padding:32px; display:grid; gap:16px; }
  dialog h2 { font-size:20px; }
  .field { display:grid; gap:4px; font-size:12px; font-weight:500; color:var(--text-2); }
  .field input, .field textarea { font-size:14px; font-weight:400; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  .field input { height:40px; }
  .field input:focus, .field textarea:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.2); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:520px) { .two { grid-template-columns:1fr; } dialog form { padding:24px; } }
  .actions { display:flex; justify-content:space-between; gap:8px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Lịch thi 2026</h1><div class="sub"><span id="todayText"></span> <a href="#lich" class="status" id="status"></a></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="exportBtn">Xuất JSON</button>
      <button class="btn" id="importBtn">Nhập JSON</button>
      <button class="btn primary" id="addBtn">+ Thêm mốc</button>
    </div>
  </header>

  <div class="dash" id="dash"></div>

  <section id="lich">
    <div class="split">
      <div><div class="sec-head"><h2>Ngày thi trùng nhau</h2><span class="count" id="clashCount"></span></div><div class="card conflicts" id="clashes"></div></div>
      <div><div class="sec-head"><h2>Giai đoạn</h2></div><div class="card phases" id="phases"></div></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>Timeline</h2></div>
    <div class="card tl"><div class="tl-inner" id="timeline"></div></div>
  </section>

  <section>
    <div class="sec-head"><h2>Giai đoạn chồng lấn</h2><span class="count" id="cfCount"></span><span class="legend"><i></i>những ngày bị chồng</span></div>
    <div class="card conflicts" id="conflicts"></div>
  </section>

  <section>
    <div class="toolbar">
      <div class="sec-head" style="margin:0"><h2>Tất cả các mốc</h2></div>
      <label class="toggle"><input type="checkbox" id="showPast"> Hiện mốc đã qua</label>
    </div>
    <div class="chips" id="filters" style="margin-bottom:24px"></div>
    <div id="list"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Thông tin cuộc thi</h2><span class="muted" style="font-size:12px">cập nhật 28/09/2026 · "mùa trước" = thông tin năm cũ, cần kiểm tra</span></div>
    <div class="info-grid" id="info"></div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle"></h2>
    <label class="field">Cuộc thi <input name="contest" list="contests" required></label>
    <datalist id="contests"></datalist>
    <label class="field">Tên mốc / vòng <input name="title" required></label>
    <div class="two">
      <label class="field">Từ ngày <input type="date" name="start" required></label>
      <label class="field">Đến ngày (bỏ trống nếu 1 ngày) <input type="date" name="end"></label>
    </div>
    <div class="two">
      <label class="field">Giờ <input name="time" placeholder="08:00 - 16:30"></label>
      <label class="field">Địa điểm <input name="place"></label>
    </div>
    <label class="toggle"><input type="checkbox" name="tentative"> Ngày chưa chính thức</label>
    <label class="field">Cần chuẩn bị (mỗi dòng 1 việc) <textarea name="checklist" rows="5"></textarea></label>
    <label class="field">Ghi chú <textarea name="notes" rows="3"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn">Xoá</button>
      <span style="display:flex;gap:8px">
        <button class="btn" value="cancel" formnovalidate>Huỷ</button>
        <button class="btn primary" value="save">Lưu</button>
      </span>
    </div>
  </form>
</dialog>
<input type="file" id="fileIn" accept="application/json" hidden>

<script>
const KEY = 'contest-schedule-2026';
const COLORS = { 'Big Idea (UEH)':'#e11d48', 'ISB (UEH)':'#2563eb', 'DBC':'#059669', 'AISC (UIT)':'#7c3aed' };
const FALLBACK = ['#ea580c','#0891b2','#ca8a04','#db2777','#4f46e5'];

// bump SEED_V whenever SEED/CONTESTS change so browsers with saved data pick up the new seed
const SEED_V = 2;
const e = (id, contest, title, start, end, extra = {}) => ({ id, seed:true, contest, title, start, end: end || start, time:'', place:'', notes:'', tentative:false, checklist:[], ...extra });
const cl = (...items) => items.map(t => ({ t, done:false }));
const SEED = [
  e('bi-final', 'Big Idea (UEH)', 'Chung kết (Final day)', '2026-10-01', null, { place:'UEH',
    notes:'Chưa tìm thấy giờ / phòng / dress code công khai – hỏi BTC. Mùa 2024: Top 6 pitch tại Gala, bình chọn SV chiếm 10% điểm (vote fanpage + tại Gala).',
    checklist: cl('Hỏi BTC: giờ check-in, phòng, dress code','Hỏi BTC: thời lượng pitch & Q&A, tiêu chí chấm','Nộp slide chung kết (hỏi hạn nộp)','Tập pitch + chuẩn bị Q&A','Kêu gọi bình chọn (nếu năm nay còn vote)') }),

  e('aisc-r1', 'AISC (UIT)', 'Vòng 1 · Khởi động – nộp hồ sơ', '2026-08-01', '2026-09-15', {
    notes:'Kết quả công bố 25/09 – tra tại httt.uit.edu.vn/aisc/tra-cuu-ket-qua bằng email + mã hồ sơ AISC26-xxxx.',
    checklist: cl('Đăng ký trực tuyến','Chọn chủ đề dự thi','Hoàn thiện hồ sơ','Nộp thuyết minh đề tài','Tra kết quả Vòng 1') }),

  const raw = JSON.parse(localStorage.getItem(KEY));

  events = !stored ? SEED : stored.v === SEED_V ? stored.events : mergeSeed(stored.events);
} catch { events = SEED; }

// new seed wins, but keep ticked checklist items and user-added events.
// old seed events are matched by id, or (for v1 data with random ids) by contest + dates.
function mergeSeed(old) {
  const used = new Set();
  const merged = SEED.map(s => {
    const o = old.find(x => !used.has(x) && (x.id === s.id || (x.contest === s.contest && x.start === s.start && x.end === s.end)));
    if (!o) return s;
    used.add(o);
    const done = new Map(o.checklist.map(i => [i.t, i.done]));
    return { ...s, checklist: s.checklist.map(i => ({ ...i, done: done.get(i.t) || false })) };
  });
  return [...merged, ...old.filter(x => !used.has(x) && !x.seed)];
}
save();

// dates: 'YYYY-MM-DD' → day number (UTC, so no DST/timezone drift)
const day = s => Date.UTC(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10)) / 864e5;
const now = new Date();
const TODAY = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5;
const fmt = s => s.slice(8,10) + '/' + s.slice(5,7);
const dstr = d => new Date(d * 864e5).toISOString().slice(0,10);
const range = ev => ev.start === ev.end ? fmt(ev.start) : fmt(ev.start) + ' → ' + fmt(ev.end);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const contests = () => [...new Set(events.map(x => x.contest))];
const color = c => COLORS[c] || FALLBACK[contests().indexOf(c) % FALLBACK.length];
const isPast = ev => day(ev.end) < TODAY;

// overlapping pairs across different contests.
// level 2 = two exam days on the same day, 1 = exam day inside another round, 0 = two rounds running in parallel
function findConflicts(list) {
  const out = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j];
    if (a.contest === b.contest) continue;
    const from = Math.max(day(a.start), day(b.start)), to = Math.min(day(a.end), day(b.end));
    if (from > to || to < TODAY) continue;
    out.push({ a, b, from, to, level: (a.start === a.end) + (b.start === b.end) });
  }
  return out.sort((x, y) => y.level - x.level || x.from - y.from);
}

// same-date exam days: [['YYYY-MM-DD', [events]], ...] for dates with ≥2 contests, upcoming only
function findClashes(list) {
  const byDate = new Map();
  for (const x of list) if (x.start === x.end && day(x.start) >= TODAY) byDate.set(x.start, [...(byDate.get(x.start) || []), x]);
  return [...byDate].filter(([, evs]) => new Set(evs.map(x => x.contest)).size > 1).sort(([a], [b]) => a < b ? -1 : 1);
}

function countdown(ev) {
  const s = day(ev.start) - TODAY, en = day(ev.end) - TODAY;
  if (en < 0) return ['Đã qua', ''];
  if (s <= 0) return [ev.start === ev.end ? 'Hôm nay' : en ? `Đang diễn ra · còn ${en} ngày` : 'Ngày cuối', 'now'];
  return [s === 1 ? 'Ngày mai' : `còn ${s} ngày`, s <= 7 ? 'soon' : ''];
}

const progress = ev => {
  const done = ev.checklist.filter(i => i.done).length;

};

    const band = `<i class="band" style="left:${p(c.from)}%;width:${n / span * 100}%"></i>`;
    const lane = x => {
      const single = x.start === x.end;
      return `<div class="lane" data-open="${x.id}">
        <div class="lane-label"><span class="dot" style="background:${color(x.contest)}"></span><span><b style="font-weight:500">${esc(x.title)}</b> <span class="muted">· ${esc(x.contest)}</span></span></div>
        <div class="lane-track"><div class="lane-bar ${single ? 'single' : ''}" style="left:${single ? p(day(x.start) + .5) : p(day(x.start))}%;width:${(day(x.end) - day(x.start) + 1) / span * 100}%;background:${color(x.contest)}"></div>${band}</div>
      </div>`;
    };
    return `<div class="ov">
      <div class="ov-head"><b>${n === 1 ? fmt(dstr(c.from)) : fmt(dstr(c.from)) + ' → ' + fmt(dstr(c.to))}</b><span class="muted">${n} ngày chung</span>
        <span class="ov-kind">${c.level ? 'Ngày thi giữa giai đoạn khác' : 'Hai giai đoạn song song'}</span></div>
      ${lane(c.a)}${lane(c.b)}
      <div class="lane"><span></span><div class="lane-dates"><span>${fmt(dstr(lo))}</span><span>${fmt(dstr(hi - 1))}</span></div></div>
    </div>`;
  }).join('') || '<div class="empty">Không có giai đoạn nào chồng lấn.</div>';

  // timeline: whole months spanning all events
  const tl = document.getElementById('timeline');
  if (!all.length) { tl.innerHTML = '<div class="empty">Chưa có mốc nào.</div>'; }
  else {
    const minS = all.reduce((m, x) => x.start < m ? x.start : m, all[0].start);
    const maxE = all.reduce((m, x) => x.end > m ? x.end : m, all[0].end);
    let y = +minS.slice(0,4), mo = +minS.slice(5,7) - 1;
    const t0 = Date.UTC(y, mo, 1) / 864e5, months = [];
    while (Date.UTC(y, mo, 1) / 864e5 <= day(maxE)) { months.push([y, mo]); if (++mo === 12) { mo = 0; y++; } }
    const t1 = Date.UTC(y, mo, 1) / 864e5, span = t1 - t0;
    const pct = d => ((d - t0) / span * 100) + '%';
    let html = '<div class="months">' + months.map(([yy, mm]) => {
      const w = (Date.UTC(yy, mm + 1, 1) - Date.UTC(yy, mm, 1)) / 864e5 / span * 100;
      return `<div style="width:${w}%">Tháng ${mm + 1}</div>`; }).join('') + '</div>';
    html += '<div class="grid-lines">' + months.map(([yy, mm]) => `<i style="left:${pct(Date.UTC(yy, mm, 1) / 864e5)}"></i>`).join('') + '</div>';
    for (const c of contests().filter(c => !hidden.has(c))) {
      // greedy lanes so overlapping bars in one contest don't cover each other
      const lanes = [], evs = all.filter(x => x.contest === c).sort(byStart);
      const bars = evs.map(ev => {
        let l = lanes.findIndex(end => end < day(ev.start));
        if (l < 0) l = lanes.push(0) - 1;
        lanes[l] = day(ev.end) + 1;
        const single = ev.start === ev.end, w = (day(ev.end) - day(ev.start) + 1) / span * 100;
        const cls = ['bar', single && 'single', ev.tentative && 'tentative', isPast(ev) && 'past'].filter(Boolean).join(' ');
        const left = single ? pct(day(ev.start) + .5) : pct(day(ev.start));
        return `<div class="${cls}" data-open="${ev.id}" title="${esc(ev.title)} · ${range(ev)}" style="left:${left};width:${w}%;top:${8 + l * 32}px;background:${color(c)}">${single ? '' : esc(ev.title)}</div>`;
      });
      html += `<div class="row"><div class="row-label"><span class="dot" style="background:${color(c)}"></span>${esc(c)}</div><div class="track" style="height:${16 + lanes.length * 32}px">${bars.join('')}</div></div>`;
    }
    if (TODAY >= t0 && TODAY < t1) html += `<div class="today" style="left:calc(var(--lw) + (100% - var(--lw)) * ${(TODAY + .5 - t0) / span})"><span>Hôm nay</span></div>`;
    tl.innerHTML = html;
  }

  // filters
  document.getElementById('filters').innerHTML = contests().map(c =>
    `<button class="chip" data-contest="${esc(c)}" aria-pressed="${!hidden.has(c)}"><span class="dot" style="background:${color(c)}"></span>${esc(c)}</button>`).join('');

  // cards grouped by month
  const showPast = document.getElementById('showPast').checked;
  const groups = new Map();
  for (const ev of all.filter(x => showPast || !isPast(x)).sort(byStart)) {
    const k = ev.start.slice(0, 7);
    groups.set(k, [...(groups.get(k) || []), ev]);
  }
  document.getElementById('list').innerHTML = [...groups].map(([k, evs]) => `
    <div class="month">
      <div class="month-head eyebrow">Tháng ${+k.slice(5)} · ${k.slice(0,4)}</div>
      <div class="grid">${evs.map(ev => {
        const [label, cls] = countdown(ev);
        const done = ev.checklist.filter(i => i.done).length;
        return `<div class="card ev ${isPast(ev) ? 'past' : ''}" data-open="${ev.id}" data-id="${ev.id}">
          <div class="ev-top">${contestLabel(ev.contest)}<span class="badge ${cls}">${label}</span></div>
          <h3>${esc(ev.title)}</h3>
          ${metaLine(ev)}
          ${clashIds.has(ev.id) ? '<div class="tag" style="color:var(--red)">⚠ Trùng ngày thi với cuộc thi khác</div>' : ''}
          ${ev.notes ? `<div class="notes">${esc(ev.notes)}</div>` : ''}
          ${ev.checklist.length ? `<div class="checklist">
            <div class="checklist-head"><span>Cần chuẩn bị</span><span>${done}/${ev.checklist.length}</span></div>${progress(ev)}
            <ul>${ev.checklist.map((it, i) => `<li class="${it.done ? 'done' : ''}"><label><input type="checkbox" data-check="${i}" ${it.done ? 'checked' : ''}>${esc(it.t)}</label></li>`).join('')}</ul>
          </div>` : ''}
        </div>`;
      }).join('')}</div>
    </div>`).join('') || '<div class="card empty">Không có mốc nào sắp tới.</div>';
  renderInfo();
}

function infoCard(c) {
  const contact = t => t.includes('@') ? `<a class="mail" href="mailto:${esc(t)}">${esc(t)}</a>` : esc(t);
  const i = CONTESTS[c];
  return `<div class="card info">
      ${contestLabel(c)}
      <div><h3>${esc(i.name)}</h3><div class="muted">${esc(i.org)}</div></div>
      <div class="links">${i.links.map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join('')}</div>
      <div class="muted">${i.contact.map(contact).join(' · ')}</div>
      <ul class="facts">${i.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
      <div class="ask"><div class="eyebrow">Cần hỏi BTC</div><ul>${i.ask.map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>
    </div>`;
}
const renderInfo = () => document.getElementById('info').innerHTML = contests().filter(c => !hidden.has(c) && CONTESTS[c]).map(infoCard).join('');

// --- interactions ---
const dlg = document.getElementById('dlg'), form = document.getElementById('form');
let editing = null;

function openEditor(ev) {
  editing = ev;
  form.reset();
  const v = ev || { contest:'', title:'', start:'', end:'', time:'', place:'', notes:'', tentative:false, checklist:[] };
  for (const k of ['contest','title','start','time','place','notes']) form[k].value = v[k];
  form.end.value = v.end && v.end !== v.start ? v.end : '';
  form.tentative.checked = v.tentative;
  form.checklist.value = v.checklist.map(i => i.t).join('\n');
  document.getElementById('dlgTitle').textContent = ev ? 'Sửa mốc' : 'Thêm mốc mới';
  document.getElementById('delBtn').style.visibility = ev ? 'visible' : 'hidden';
  dlg.showModal();
}

dlg.addEventListener('close', () => {
  if (dlg.returnValue !== 'save') return;
  const f = form;
  let end = f.end.value || f.start.value;
  if (end < f.start.value) end = f.start.value;
  const old = new Map((editing?.checklist || []).map(i => [i.t, i.done]));
  const data = {
    contest: f.contest.value.trim(), title: f.title.value.trim(), start: f.start.value, end,
    time: f.time.value.trim(), place: f.place.value.trim(), notes: f.notes.value.trim(), tentative: f.tentative.checked,
    checklist: f.checklist.value.split('\n').map(s => s.trim()).filter(Boolean).map(t => ({ t, done: old.get(t) || false })),
  };
  if (editing) Object.assign(editing, data); else events.push({ id: crypto.randomUUID(), ...data });
  save(); render();
});

document.getElementById('delBtn').onclick = () => {
  if (!editing || !confirm(`Xoá "${editing.title}"?`)) return;
  events = events.filter(x => x !== editing);
  dlg.close(); save(); render();
};
document.getElementById('addBtn').onclick = () => openEditor(null);
document.getElementById('showPast').onchange = render;

document.body.addEventListener('click', ev => {
  const chk = ev.target.closest('[data-check]');
  if (chk) {
    const item = events.find(x => x.id === chk.closest('[data-id]').dataset.id).checklist[chk.dataset.check];
    item.done = chk.checked; save(); render(); return;
  }
  const chip = ev.target.closest('[data-contest]');
  if (chip) { const c = chip.dataset.contest; hidden.has(c) ? hidden.delete(c) : hidden.add(c); render(); return; }
  if (ev.target.closest('label, dialog')) return;
  const target = ev.target.closest('[data-open]');
  if (target) openEditor(events.find(x => x.id === target.dataset.open));
});

// backup: localStorage lives only in this browser, so allow export/import
document.getElementById('exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(events, null, 2)], { type:'application/json' }));
  a.download = 'lich-thi-2026.json'; a.click();
};
const fileIn = document.getElementById('fileIn');
document.getElementById('importBtn').onclick = () => fileIn.click();
fileIn.onchange = async () => {
  try {
    const data = JSON.parse(await fileIn.files[0].text());
    if (!Array.isArray(data) || !data.every(x => x.id && x.contest && x.title && x.start && x.end && Array.isArray(x.checklist))) throw 0;
    events = data; save(); render();
  } catch { alert('File JSON không hợp lệ.'); }
  fileIn.value = '';
};

// self-check for overlap logic
{
  const t = (c, s, en) => ({ contest:c, start:s, end:en || s });
  const r = findConflicts([t('A','2099-01-05'), t('B','2099-01-05'), t('C','2099-01-01','2099-01-10'), t('A','2099-02-01'), t('D','2099-01-11')]);
  console.assert(r.length === 3 && r.map(x => x.level).join() === '2,1,1', 'findConflicts broken', r);
  const k = findClashes([t('A','2099-03-10'), t('B','2099-03-10'), t('C','2099-03-10'), t('A','2099-03-11'), t('A','2099-03-12'), t('A','2099-03-12'), t('D','2099-03-01','2099-03-20')]);
  console.assert(k.length === 1 && k[0][1].length === 3, 'findClashes broken', k);
}

render();
</script>
